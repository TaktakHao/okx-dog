# =============================================================================
# OKX-Dog v6.0 - Paperclip 虚拟公司控制中枢 (Mac mini 极简轻量化编排)
# 专为 Apple Silicon ARM64 (Mac mini M1/M2/M4) 优化
# 内存配额严格限制在 ~400MB 以内，超低发热、常年静音常驻
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Paperclip 关系数据库 (PostgreSQL 17 Alpine 极简版)
  # ---------------------------------------------------------------------------
  paperclip-db:
    image: postgres:17-alpine
    container_name: okx-dog-paperclip-db
    restart: always
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${PAPERCLIP_DB_PASSWORD:-okxdog_paperclip_secret_2026}
      POSTGRES_DB: paperclip
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - paperclip_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 180M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Paperclip 组织架构控制平面 (Web 控制台 + 任务心跳调度器)
  # ---------------------------------------------------------------------------
  paperclip-control-plane:
    image: paperclipai/paperclip:latest
    container_name: okx-dog-paperclip-core
    restart: always
    depends_on:
      paperclip-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: postgres://paperclip:${PAPERCLIP_DB_PASSWORD:-okxdog_paperclip_secret_2026}@paperclip-db:5432/paperclip
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-e8f7a9c1d2e3b4a5f60718293a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:-7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d}
      # OKX-Dog 宿主机通信端点
      OKX_DOG_BACKEND_URL: http://host.docker.internal:8000
      OKX_DOG_AI_URL: http://host.docker.internal:8001
    ports:
      - "3100:3100"
    deploy:
      resources:
        limits:
          memory: 350M

volumes:
  paperclip_pgdata:
    name: okx_dog_paperclip_pgdata
